# Environment + credentials. Copy to config/env-<name>.properties (e.g.
# env-staging.properties) and fill in. env-*.properties is git-ignored. Never
# commit the filled-in copy.
#
# Values map 1:1 to e2e/pw/move-soak/.env.<env> (or e2e/pw/.env.<env>):
#   lccApiBaseUrl            <- LCC_API_BASE_URL
#   egressBaseUrl            <- EGRESS_BASE_URL
#   tenantId                 <- TENANT_ID
#   lccApiClientId           <- LCC_API_CLIENT_ID
#   egressServiceAccountAuth <- EGRESS_SERVICE_ACCOUNT_AUTH (without the surrounding quotes)
#   the E2E test account goes in aadUsername and aadPassword (from E2E_AD_USER, E2E_AD_PASSWORD)
# Case search only (searchCase=true):
#   cmrcApiClientId          <- CMRC_API_CLIENT_ID
#   ddeiBaseUrl              <- DDEI_BASE_URL
#   ddeiAccessKey            <- DDEI_ACCESS_KEY_CASE_REGISTER
#   the CMS account goes in cmsUsername and cmsPassword (from CMS_USERNAME, CMS_PASSWORD)
# Creating cases (scripts/provision-cases.ts), which also needs all of the above:
#   caseApiBaseUrl           <- CASE_API_BASE_URL
#   egressTemplateId / egressAdminRoleId: optional, default to the values in e2e/pw/helpers/constants.ts

lccApiBaseUrl=
egressBaseUrl=
tenantId=
lccApiClientId=

aadUsername=
aadPassword=
egressServiceAccountAuth=

cmrcApiClientId=
ddeiBaseUrl=
ddeiAccessKey=
cmsUsername=
cmsPassword=

caseApiBaseUrl=

# Java properties syntax: a backslash is an escape, so write a literal one as \\
