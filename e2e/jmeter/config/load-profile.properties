# Load profile: the knobs QA changes between runs. Committed; no secrets here.
# Any value can also be overridden per run with -Jname=value
# (or Run-PerfTest.ps1 -Property name=value).
#
# Defaults replicate Run 5 of the initial smoke test ("Initial Smoke Test
# Results", Raja Miah), so a fix can be retested like for like. Where the
# report recommended a change, it is noted as "Recommended:" and left off, so
# before/after runs stay comparable. Change one thing at a time.

# --- Concurrency (Run 5: 10 users, 30s ramp-up, ~7 minutes) ---
users=10
rampUpSec=30
# Iterations per user. Each iteration uploads one file and transfers it.
loops=1

# --- Mode ---
# e2e      = upload, then transfer (the smoke test)
# upload   = upload and wait for Egress, record the file in preparedCsv, no transfer
# transfer = transfer the file recorded by an upload run; the Egress file is kept for the next run
# Run-PerfTest.ps1 -Mode sets this, and points preparedCsv at data/egress-files-<env>.csv.
mode=e2e
preparedCsv=data/egress-files-staging.csv

# --- Test data ---
# Cases CSV: one row per user (caseId,workspaceId,netappFolderPath,fileSizeMb,caseUrn).
# The fileSizeMb column sets the size of the file that user uploads.
casesCsv=data/cases-staging.csv
# Override the CSV sizes for a run: one size for everyone (1024), or a list
# handed out in user order (100,1024 -> user 1 100MB, user 2 1GB, user 3 100MB...).
# Empty = use the CSV.
fileSizesMb=
# User n takes CSV row caseOffset+n. 0 = rows 1..users. Use e.g. 10 to run on
# rows 11-20 while an earlier run's transfers on rows 1-10 are still finishing.
caseOffset=0
# LCC allows one active transfer per case; sharing a case between users makes
# all but one of them poll somebody else's transfer. Leave false unless you are
# deliberately testing that.
allowSharedCase=false

# --- Case search (the smoke test's SearchCase step; needs the DDEI/CMS settings in env-*.properties) ---
searchCase=true
cmsRefreshMin=30

# --- Egress upload ---
egressSourceFolder=1. ABEs for Transcript/
filePrefix=jmeter-perf
uploadExtension=txt
chunkSizeMb=5
# Smoke test: max 3 retries per chunk, no back-off between attempts.
maxChunkRetries=3
# Recommended: a back-off, e.g. chunkRetryDelayMs=2000 (the report suggests one for NoHttpResponseException under load)
chunkRetryDelayMs=0

# --- Egress processing (upload complete -> file_id assigned -> file listed) ---
# The smoke test used a FIXED wait (30s, later 90s) then looked for the file.
# The harness polls instead, which is the approach the report recommends, and
# fails only after the timeout. Set egressFixedWaitSec=30 with
# egressListingTimeoutSec=0 to reproduce the original fixed-wait behaviour.
egressFixedWaitSec=0
egressPollIntervalMs=2000
egressProcessingTimeoutSec=90
# Wait until the LCC API lists the file (the smoke test's GetEgressFiles check)
waitForEgressListing=true
egressListingPollIntervalMs=3000
egressListingTimeoutSec=90
egressListingTake=100

# --- LCC transfer ---
# Smoke test: Copy, status polled every 5s, giving up after 30 polls (2.5 minutes).
transferType=Copy
validateBeforeTransfer=true
transferPollIntervalSec=5
# 0 = no poll limit (only transferTimeoutMin applies).
# Recommended: a longer window for 450MB-1GB files, e.g. transferMaxPolls=0 with transferTimeoutMin=30
transferMaxPolls=30
transferTimeoutMin=60
# Clear the case's active transfer after polling (as the Playwright harness does),
# so the next run is not blocked by a leftover active transfer.
clearTransfers=true
# A Copy leaves the uploaded file in Egress; delete it afterwards to keep the folder small.
cleanupEgressAfterCopy=true
# Delete each transferred file from the case's NetApp folder afterwards, so
# copies don't pile up when the same cases are reused run after run.
# Needs the DDEI/CMS settings in env-*.properties.
cleanupNetAppAfterTransfer=true

# --- Token refresh and HTTP timeouts ---
aadRefreshMin=45
# Egress session tokens expire after 10 minutes.
egressRefreshMin=8
httpConnectTimeoutMs=30000
httpResponseTimeoutMs=300000
